<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TACTICAL DEPLOY</title>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({ appId: "3355715f-9856-4371-a3d2-8b1bd033b48c" });
      });
    </script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100dvh; transition: 0.3s; border: 0px solid transparent; box-sizing: border-box; }
        .proximity-orange { border: 8px solid #e67e22 !important; }
        .proximity-red { border: 10px solid #ff0000 !important; animation: blink-red 0.5s infinite; }
        @keyframes blink-red { from { opacity: 1; } to { opacity: 0.7; } }
        #qr-lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #reader { width: 85%; max-width: 400px; border: 2px solid #e74c3c; border-radius: 8px; overflow: hidden; background: #000; }
        #main-app { display: none; flex-direction: column; height: 100dvh; width: 100%; }
        #main-title { width: 80%; margin: 10px auto; text-align: center; padding: 10px; border: 2px solid #e74c3c; color: #e74c3c; font-weight: bold; background: #2c2c2c; border-radius: 8px; text-transform: uppercase; letter-spacing: 2px; flex-shrink: 0; }
        #map { flex-grow: 1; width: 100%; background: #222; }
        #notification-banner { position: absolute; top: 75px; left: 50%; transform: translateX(-50%); width: 85%; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; z-index: 1001; display: none; pointer-events: auto; font-size: 1.1rem; border: 2px solid white; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .alert-active { display: block !important; background: #ff0000 !important; animation: pulse-red 0.5s infinite alternate; }
        .alert-stopstick { display: block !important; background: #8e44ad !important; }
        .ss-success { background: #2ecc71 !important; }
        .ss-fail { background: #e74c3c !important; }
        .ss-choice-box { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn-ss-res { padding: 8px 20px; border: 2px solid white; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        #ui-panel { padding: 15px; background: #2c2c2c; z-index: 1000; flex-shrink: 0; border-top: 2px solid #444; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 0.75rem; }
        #btn-pec { background: #e67e22; grid-column: span 2; height: 55px; font-size: 0.9rem; }
        .active-leader { background: #c0392b !important; border: 2px solid white; }
        input { width: 100%; padding: 12px; background: #444; border: 1px solid #666; color: white; border-radius: 4px; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; text-align: center; }
    </style>
</head>
<body id="app-body">
<div id="qr-lock-screen">
    <div style="color:#e74c3c; font-weight:bold; margin-bottom:15px; text-transform:uppercase;">🔐 Identification Requise</div>
    <div id="reader"></div>
    <p style="color:#888; font-size:0.8rem; margin-top:15px;">Scannez le QR Code de service</p>
</div>
<div id="main-app">
    <div id="main-title">TACTICAL DEPLOY</div>
    <div id="notification-banner">
        <div id="banner-text"></div>
        <div id="ss-choices" class="ss-choice-box" style="display:none;">
            <div class="btn-ss-res" style="background:#2ecc71" onclick="submitSS('POSITIF')">POSITIF</div>
            <div class="btn-ss-res" style="background:#e74c3c" onclick="submitSS('NÉGATIF')">NÉGATIF</div>
        </div>
    </div>
    <div id="map"></div>
    <div id="ui-panel">
        <input type="text" id="user-id" placeholder="NOM DE L'UNITÉ">
        <div class="btn-grid">
            <button style="background:#444" id="btn-clear">🧹 NETTOYER</button>
            <button style="background:#8e44ad" id="btn-stopstick">🚧 STOP STICK</button>
            <button id="btn-pec">🚨 DÉMARRER PRISE EN CHARGE</button>
        </div>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const secretKey = "TACTICAL-UNLOCK-2026";
    const lockScreen = document.getElementById('qr-lock-screen');
    const mainApp = document.getElementById('main-app');
    let audioCtx = null;
    function playBip() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = "square"; osc.frequency.setValueAtTime(440, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
    function unlock() { localStorage.setItem('tactical_authorized', 'true'); lockScreen.style.display = 'none'; mainApp.style.display = 'flex'; initTacticalApp(); }
    if (localStorage.getItem('tactical_authorized') === 'true') { unlock(); } else { const html5QrCode = new Html5Qrcode("reader"); html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => { if (decodedText.trim() === secretKey) { html5QrCode.stop().then(() => unlock()); } }).catch(() => console.log("Attente...")); }
    var db;
    function initTacticalApp() {
        const firebaseConfig = { databaseURL: "https://poursuite-tactique-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        const idInput = document.getElementById('user-id');
        const btnPec = document.getElementById('btn-pec');
        const btnClear = document.getElementById('btn-clear');
        const banner = document.getElementById('notification-banner');
        const bannerText = document.getElementById('banner-text');
        const ssChoices = document.getElementById('ss-choices');
        const appBody = document.getElementById('app-body');
        idInput.value = localStorage.getItem('unit_name') || "Unite-" + Math.floor(Math.random() * 999);
        idInput.oninput = () => localStorage.setItem('unit_name', idInput.value);
        const map = L.map('map', { zoomControl: false }).setView([46, 2], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const myMarker = L.circleMarker([0, 0], { color: '#3498db', radius: 10, fillOpacity: 1, weight: 3 }).addTo(map);
        let myPos = null, isPEC = false, isLeader = false, lastAlertSource = null, lastSSSource = null, lastBipTime = 0;
        const markers = {};
        function getDistance(lat1, lon1, lat2, lon2) { const R = 6371e3; const φ1 = lat1 * Math.PI/180; const φ2 = lat2 * Math.PI/180; const a = Math.sin(((lat2-lat1)*Math.PI/180)/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(((lon2-lon1)*Math.PI/180)/2)**2; return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }
        function speak(text, times = 1) { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'fr-FR'; utterance.rate = 1.1; for (let i = 0; i < times; i++) { window.speechSynthesis.speak(utterance); } } }
        window.submitSS = (res) => { db.ref('alerts/stopstick').update({ result: res, active: false, ts: Date.now() }); setTimeout(() => { db.ref('alerts/stopstick').remove(); }, 5000); };
        function sync(remove = false) { if (!myPos) return; const safeId = idInput.value.trim().replace(/[^a-zA-Z0-9]/g, "_"); if (remove) { db.ref('vehicles/' + safeId).remove(); } else { db.ref('vehicles/' + safeId).set({ lat: myPos.lat, lon: myPos.lon, active: isLeader, ts: Date.now() }); } }
        navigator.geolocation.watchPosition((p) => { myPos = { lat: p.coords.latitude, lon: p.coords.longitude }; myMarker.setLatLng([myPos.lat, myPos.lon]); map.setView([myPos.lat, myPos.lon], map.getZoom()); if (isPEC) sync(); }, null, { enableHighAccuracy: true });
        btnPec.onclick = function() { const unitName = idInput.value.trim().toUpperCase(); isPEC = !isPEC; if (!isPEC) { if (isLeader) { db.ref('vehicles').remove(); db.ref('alerts').remove(); } else { sync(true); } isLeader = false; } else { if (!lastAlertSource) { isLeader = true; OneSignalDeferred.push(async function(OneSignal) { OneSignal.postNotification({ contents: { "fr": "L'unité " + unitName + " a démarré une interception !" }, headings: { "fr": "🚨 ALERTE PRISE EN CHARGE" } }); }); } sync(); } updateUI(); };
        btnClear.onclick = () => { if(confirm("Nettoyer Unités + Alertes ?")) { db.ref('vehicles').remove(); db.ref('alerts').remove(); location.reload(); } };
        function updateUI() { btnPec.classList.toggle('active-leader', (isLeader && isPEC)); btnPec.innerText = isPEC ? (isLeader ? "🛑 STOP INTERCEPTION (GLOBAL)" : "🏃 QUITTER LE DISPOSITIF") : (lastAlertSource ? "📡 REJOINDRE DISPOSITIF" : "🚨 DÉMARRER PRISE EN CHARGE"); }
        db.ref('alerts/stopstick').on('value', (s) => { const data = s.val(); if (!data) { banner.classList.remove('alert-active', 'alert-stopstick', 'ss-success', 'ss-fail'); ssChoices.style.display = "none"; return; } if (data.active) { bannerText.innerText = "🚧 ATTENTION : STOP STICK PAR " + data.user; banner.classList.add('alert-active', 'alert-stopstick'); if (data.user === idInput.value.trim().toUpperCase()) ssChoices.style.display = "flex"; if (lastSSSource !== data.ts) { speak("Attention, stop stick par " + data.user, 3); lastSSSource = data.ts; } } else if (data.result) { banner.classList.remove('alert-stopstick'); banner.classList.add(data.result === 'POSITIF' ? 'ss-success' : 'ss-fail'); bannerText.innerText = "🚧 STOP STICK : " + (data.result === 'POSITIF' ? 'RÉUSSITE' : 'ÉCHEC'); ssChoices.style.display = "none"; if (lastSSSource !== data.ts + "_res") { speak("Stop stick " + data.result, 3); lastSSSource = data.ts + "_res"; } setTimeout(() => { banner.classList.remove('ss-success', 'ss-fail'); if(!lastAlertSource && !isPEC) banner.classList.remove('alert-active'); }, 5000); } });
        db.ref('vehicles').on('value', (snapshot) => { const data = snapshot.val() || {}; let currentAlert = null; let minDistance = Infinity; const mySafeId = idInput.value.trim().replace(/[^a-zA-Z0-9]/g, "_"); for (let id in data) { const v = data[id]; if (v.active) currentAlert = id.replace(/_/g, ' '); if (id !== mySafeId) { if (!markers[id]) markers[id] = L.circleMarker([v.lat, v.lon], { radius: 8, fillOpacity: 1 }).addTo(map); markers[id].setLatLng([v.lat, v.lon]).setStyle({ color: v.active ? '#ff0000' : '#2ecc71' }); if (myPos) { const d = getDistance(myPos.lat, myPos.lon, v.lat, v.lon); if (d < minDistance) minDistance = d; } } } for (let id in markers) if (!data[id]) { map.removeLayer(markers[id]); delete markers[id]; } appBody.classList.remove('proximity-orange', 'proximity-red'); if (minDistance <= 200) { appBody.classList.add('proximity-red'); if(Date.now() - lastBipTime > 1000) { playBip(); lastBipTime = Date.now(); } } else if (minDistance <= 500) { appBody.classList.add('proximity-orange'); } if (currentAlert && !banner.classList.contains('alert-stopstick')) { bannerText.innerText = "🚨 ALERTE : PRISE EN CHARGE PAR " + currentAlert.toUpperCase(); banner.classList.add('alert-active'); if (lastAlertSource !== currentAlert) { speak(currentAlert + " prend en charge", 3); lastAlertSource = currentAlert; } } else if (!currentAlert && !banner.classList.contains('alert-stopstick')) { banner.classList.remove('alert-active'); lastAlertSource = null; } updateUI(); });
        document.getElementById('btn-stopstick').onclick = () => { const name = idInput.value.trim().toUpperCase(); db.ref('alerts/stopstick').set({ user: name, ts: Date.now(), active: true, result: null }); };
    }
</script>
</body>
</html>
