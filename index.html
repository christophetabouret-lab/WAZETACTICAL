<script>
    // ... (gardez les variables globales et fonctions speak/unlock identiques)

    function initApp() {
        // ... (initialisation Firebase et Map identique)

        // MODIFICATION DE LA LOGIQUE DU BOUTON PRINCIPAL
        document.getElementById('btn-main').onclick = () => {
            if (inAction) {
                // Si on est en action (Leader OU Équipier), on propose de finir pour TOUT LE MONDE
                bannerStartTime = 0; 
                setBanner("SÉLECTIONNER RÉSULTAT FINAL", "bg-red"); 
                document.getElementById('end-choices').style.display = 'flex'; 
                document.getElementById('ss-choices').style.display = 'none'; 
                return; 
            }
            // Sinon, on démarre ou on rejoint
            inAction = true; 
            isLeader = (currentLeader === null); 
            updateUI(); 
            sync();
        };

        // FONCTION DE FIN DE MISSION (Appelée par n'importe qui)
        window.endInter = (r) => { 
            const unitName = idInput.value.toUpperCase() || "INCONNUE";
            // 1. On informe la base du résultat pour l'annonce globale
            db.ref('alerts/end').set({ 
                result: r, 
                user: unitName, 
                ts: Date.now() 
            }); 
            
            // 2. NETTOYAGE GLOBAL : On efface tous les véhicules de la base
            db.ref('vehicles').remove(); 
            
            // 3. Reset local
            inAction = false; 
            isLeader = false; 
            document.getElementById('end-choices').style.display = 'none'; 
            updateUI();
            
            // 4. Suppression de l'alerte après 10s pour laisser le temps aux autres de voir
            setTimeout(() => { db.ref('alerts/end').remove(); }, 10000); 
        };

        function updateUI() { 
            const btn = document.getElementById('btn-main'); 
            if(inAction) { 
                // Le bouton devient le déclencheur de fin de mission pour tout le monde
                btn.innerText = "🏁 METTRE FIN À LA MISSION (RÉSULTAT)"; 
                btn.style.background = "#c0392b"; 
            } else { 
                btn.innerText = currentLeader ? "📡 REJOINDRE LA PRISE EN CHARGE" : "🚨 DÉMARRER PRISE EN CHARGE"; 
                btn.style.background = "#e67e22"; 
            } 
        }

        // ECOUTEUR DE FIN DE MISSION
        db.ref('alerts/end').on('value', (s) => {
            const d = s.val(); 
            if(!d) return;

            // Si un autre équipage a fini la mission, on remet l'interface à zéro localement
            if (inAction) {
                inAction = false;
                isLeader = false;
                updateUI();
            }

            let cl = (d.result === 'INTERPELLATION') ? 'bg-green' : (d.result === 'INDIVIDU EN FUITE' ? 'bg-orange' : 'bg-grey');
            setBanner("🏁 " + d.result + " PAR " + d.user, cl, 10000); 
            speak("Mission terminée. Résultat : " + d.result + ". Par l'unité " + d.user);
        });

        // ... (reste du code db.ref('vehicles').on('value') identique)
    }
</script>
