<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TACTICAL DEPLOY</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100dvh; transition: 0.3s; border: 0px solid transparent; box-sizing: border-box; }
        
        /* ALERTES DE PROXIMITÉ SUR TOUTE L'INTERFACE */
        .proximity-orange { border: 8px solid #e67e22 !important; }
        .proximity-red { border: 10px solid #ff0000 !important; animation: blink-red 0.5s infinite; }
        @keyframes blink-red { from { opacity: 1; } to { opacity: 0.7; } }

        #main-title { width: 80%; margin: 10px auto; text-align: center; padding: 10px; border: 2px solid #e74c3c; color: #e74c3c; font-weight: bold; background: #2c2c2c; border-radius: 8px; text-transform: uppercase; letter-spacing: 2px; flex-shrink: 0; }
        #map { flex-grow: 1; width: 100%; background: #222; }
        #notification-banner { position: absolute; top: 70px; left: 5%; width: 90%; padding: 15px; border-radius: 4px; font-weight: bold; text-align: center; z-index: 1001; display: none; pointer-events: none; font-size: 1.1rem; border: 2px solid white; }
        .alert-active { display: block !important; background: #ff0000 !important; animation: pulse-red 0.5s infinite alternate; box-shadow: 0 0 20px #ff0000; }
        @keyframes pulse-red { from { opacity: 1; } to { opacity: 0.6; } }
        
        #ui-panel { padding: 15px; background: #2c2c2c; z-index: 1000; flex-shrink: 0; border-top: 2px solid #444; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 0.75rem; }
        #btn-signal { background: #3498db; }
        #btn-signal.active { background: #2ecc71; border: 2px solid white; }
        #btn-clear { background: #8e44ad; }
        #btn-pec { background: #e67e22; grid-column: span 2; margin-top: 5px; height: 55px; font-size: 0.9rem; }
        #btn-pec.active { background: #c0392b; border: 2px solid white; box-shadow: 0 0 15px #ff0000; }
        input { width: 100%; padding: 12px; background: #444; border: 1px solid #666; color: white; border-radius: 4px; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; text-align: center; }
    </style>
</head>
<body id="app-body">

<div id="main-title">TACTICAL DEPLOY</div>
<div id="notification-banner"></div>
<div id="map"></div>

<div id="ui-panel">
    <input type="text" id="user-id" placeholder="NOM DE L'UNITÉ">
    <div class="btn-grid">
        <button id="btn-signal">📡 REJOINDRE LE DISPOSITIF</button>
        <button id="btn-clear">🧹 NETTOYER BASE</button>
        <button id="btn-pec">🚨 DÉMARRER PRISE EN CHARGE</button>
    </div>
</div>

<audio id="silent-bkg" loop><source src="data:audio/wav;base64,UklGRigAAABXQVZFRm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" type="audio/wav"></audio>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://poursuite-tactique-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const idInput = document.getElementById('user-id');
    const btnSignal = document.getElementById('btn-signal');
    const btnPec = document.getElementById('btn-pec');
    const appBody = document.getElementById('app-body');
    const silentAudio = document.getElementById('silent-bkg');

    idInput.value = localStorage.getItem('unit_name') || "Unite-" + Math.floor(Math.random() * 999);
    idInput.oninput = () => localStorage.setItem('unit_name', idInput.value);

    const map = L.map('map', { zoomControl: false }).setView([46, 2], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const myMarker = L.circleMarker([0, 0], { color: '#3498db', radius: 10, fillOpacity: 1, weight: 3 }).addTo(map);
    let myPos = null, isVisible = false, isPEC = false, hasCentered = false;
    let lastAlertSource = null, wakeLock = null;
    const markers = {};

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function activateTacticalMode() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        silentAudio.play().catch(() => {});
    }

    function deactivateTacticalMode() {
        if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
        silentAudio.pause();
    }

    function speakTriple(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.1;
            for (let i = 0; i < 3; i++) { window.speechSynthesis.speak(utterance); }
        }
    }

    function sync(forceStop = false) {
        if (!myPos) return;
        const name = idInput.value.trim() || "Anonyme";
        const safeId = name.replace(/[^a-zA-Z0-9]/g, "_");
        const activeState = forceStop ? false : isPEC;
        myMarker.setStyle({ color: activeState ? '#ff0000' : '#3498db' });
        if (isVisible || activeState) {
            db.ref('vehicles/' + safeId).set({ lat: myPos.lat, lon: myPos.lon, active: activeState, ts: Date.now() });
        } else {
            db.ref('vehicles/' + safeId).remove();
        }
    }

    btnSignal.onclick = function() {
        isVisible = !isVisible;
        this.classList.toggle('active', isVisible);
        this.innerText = isVisible ? "📡 QUITTER LE DISPOSITIF" : "📡 REJOINDRE LE DISPOSITIF";
        if (isVisible || isPEC) activateTacticalMode(); else deactivateTacticalMode();
        sync();
    };

    btnPec.onclick = function() {
        isPEC = !isPEC;
        if (!isPEC) {
            document.getElementById('notification-banner').classList.remove('alert-active');
            lastAlertSource = null;
            window.speechSynthesis.cancel();
            if (!isVisible) deactivateTacticalMode();
        } else {
            isVisible = true;
            btnSignal.classList.add('active');
            btnSignal.innerText = "📡 QUITTER LE DISPOSITIF";
            activateTacticalMode();
        }
        this.classList.toggle('active', isPEC);
        this.innerText = isPEC ? "🛑 STOP INTERCEPTION" : "🚨 DÉMARRER PRISE EN CHARGE";
        sync(!isPEC);
    };

    navigator.geolocation.watchPosition((p) => {
        myPos = { lat: p.coords.latitude, lon: p.coords.longitude };
        myMarker.setLatLng([myPos.lat, myPos.lon]);
        if (!hasCentered) { map.setView([myPos.lat, myPos.lon], 16); hasCentered = true; }
        if (isVisible) sync();
    }, null, { enableHighAccuracy: true });

    db.ref('vehicles').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        let alertSource = null;
        let minDistance = Infinity;
        const mySafeId = idInput.value.trim().replace(/[^a-zA-Z0-9]/g, "_");

        for (let id in data) {
            const v = data[id];
            if (id !== mySafeId && (!v.ts || (Date.now() - v.ts > 120000))) continue;
            
            if (id !== mySafeId && myPos) {
                const dist = getDistance(myPos.lat, myPos.lon, v.lat, v.lon);
                if (dist < minDistance) minDistance = dist;
                
                if (!markers[id]) markers[id] = L.circleMarker([v.lat, v.lon], { radius: 8, fillOpacity: 1 }).addTo(map).bindPopup(id.replace(/_/g, ' '));
                markers[id].setLatLng([v.lat, v.lon]);
                markers[id].setStyle({ color: v.active ? '#ff0000' : '#2ecc71' });
            }
            if (v.active) alertSource = id.replace(/_/g, ' ');
        }

        for (let id in markers) { if (!data[id]) { map.removeLayer(markers[id]); delete markers[id]; } }

        // GESTION VISUELLE ANTI-COLLISION
        appBody.classList.remove('proximity-orange', 'proximity-red');
        if (minDistance <= 200) appBody.classList.add('proximity-red');
        else if (minDistance <= 500) appBody.classList.add('proximity-orange');

        const banner = document.getElementById('notification-banner');
        if (alertSource) {
            banner.innerText = "🚨 ALERTE : PRISE EN CHARGE PAR " + alertSource.toUpperCase();
            banner.classList.add('alert-active');
            if (lastAlertSource !== alertSource) {
                speakTriple("Attention, prise en charge par " + alertSource);
                lastAlertSource = alertSource;
            }
        } else {
            banner.classList.remove('alert-active');
            lastAlertSource = null;
        }
    });

    document.getElementById('btn-clear').onclick = () => { if(confirm("Nettoyer la base ?")) db.ref('vehicles').remove(); };
</script>
</body>
</html>
