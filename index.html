<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TACTICAL DEPLOY</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; overflow: hidden; }
        
        #main-title {
            width: 80%; margin: 10px auto; text-align: center;
            padding: 12px; border: 2px solid #e74c3c; color: #e74c3c;
            font-weight: bold; background: #2c2c2c; border-radius: 8px;
            text-transform: uppercase; letter-spacing: 2px;
        }

        #ui-panel { padding: 10px 15px; background: #2c2c2c; z-index: 1000; position: relative; border-bottom: 2px solid #444; }

        #notification-banner { 
            padding: 15px; border-radius: 4px; font-weight: bold; text-align: center;
            background: #27ae60; margin-bottom: 10px; font-size: 1.1rem;
            transition: all 0.3s;
        }

        .alert-active { 
            background: #ff0000 !important; 
            animation: pulse-red 0.5s infinite alternate;
        }

        @keyframes pulse-red { from { opacity: 1; } to { opacity: 0.7; } }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 0.75rem; transition: 0.2s; }
        
        #btn-vocal { background: #34495e; }
        #btn-vocal.on { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        #btn-signal { background: #3498db; }
        #btn-signal.active { background: #2ecc71; }
        #btn-pec { background: #e67e22; grid-column: span 2; margin-top: 8px; height: 45px; font-size: 0.9rem; }
        #btn-pec.active { background: #c0392b; animation: pulse-red 0.8s infinite; }
        #btn-sat { background: #2c3e50; height: 35px; border: 1px solid #7f8c8d; }

        input { 
            width: 100%; padding: 12px; background: #444; border: 1px solid #666; 
            color: white; border-radius: 4px; margin-bottom: 10px; box-sizing: border-box; 
        }
        
        #map { height: calc(100vh - 360px); width: 100%; background: #222; }

        .proximity-alert {
            box-shadow: inset 0 0 50px 20px #ff0000 !important;
            border: 8px solid #ff0000 !important;
        }
    </style>
</head>
<body>

<div id="main-title">TACTICAL DEPLOY</div>

<div id="ui-panel">
    <input type="text" id="user-id" placeholder="NOM DE L'UNITÉ (ex: ALPHA-1)">
    <div id="notification-banner">SYSTÈME PRÊT</div>
    <div class="btn-grid">
        <button id="btn-vocal">🎙️ VOCAL : OFF</button>
        <button id="btn-signal">📡 SIGNAL : OFF</button>
        <button id="btn-pec">🚨 DÉMARRER PEC</button>
        <button id="btn-sat">🗺️ VUE SATELLITE</button>
    </div>
</div>

<div id="map"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Initialisation Firebase
    const firebaseConfig = { databaseURL: "https://poursuite-tactique-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Variables d'état
    const idInput = document.getElementById('user-id');
    let myName = localStorage.getItem('unit_name') || "Unite-" + Math.floor(Math.random() * 999);
    idInput.value = myName;
    
    let myPos = null;
    let isVisible = false;
    let isPEC = false;
    let firstFix = true;
    const markers = {};

    // 3. Carte
    const mapDiv = document.getElementById('map');
    const map = L.map('map', { zoomControl: false }).setView([48.85, 2.35], 13);
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
    let isSat = false;

    const myMarker = L.marker([0, 0], { zIndexOffset: 2000 }).addTo(map).bindPopup("MOI");

    // 4. Fonctions de mise à jour
    function updateFirebase() {
        if (!myPos) return;
        const safeId = myName.replace(/[^a-zA-Z0-9]/g, "_");
        if (isVisible) {
            db.ref('vehicles/' + safeId).set({
                lat: myPos.lat,
                lon: myPos.lon,
                active: isPEC,
                ts: Date.now()
            });
        } else {
            db.ref('vehicles/' + safeId).remove();
        }
    }

    // 5. Événements Boutons
    document.getElementById('btn-signal').onclick = function() {
        isVisible = !isVisible;
        this.classList.toggle('active');
        this.innerText = isVisible ? "📡 SIGNAL : ON" : "📡 SIGNAL : OFF";
        updateFirebase();
    };

    document.getElementById('btn-pec').onclick = function() {
        isPEC = !isPEC;
        this.classList.toggle('active');
        this.innerText = isPEC ? "🛑 STOP PEC" : "🚨 DÉMARRER PEC";
        updateFirebase();
    };

    document.getElementById('btn-sat').onclick = function() {
        if (!isSat) { map.removeLayer(osm); map.addLayer(sat); this.innerText = "🗺️ VUE ROUTE"; }
        else { map.removeLayer(sat); map.addLayer(osm); this.innerText = "🗺️ VUE SATELLITE"; }
        isSat = !isSat;
    };

    // 6. Surveillance GPS
    navigator.geolocation.watchPosition((p) => {
        myPos = { lat: p.coords.latitude, lon: p.coords.longitude };
        myMarker.setLatLng([myPos.lat, myPos.lon]);
        
        if (firstFix) {
            map.setView([myPos.lat, myPos.lon], 16);
            firstFix = false;
        }
        if (isVisible) updateFirebase();
    }, (err) => {
        console.error("Erreur GPS", err);
    }, { enableHighAccuracy: true });

    // 7. Ecoute temps réel
    db.ref('vehicles').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        let collision = false;
        let alertSource = null;
        const safeMyId = myName.replace(/[^a-zA-Z0-9]/g, "_");

        for (let id in data) {
            if (id === safeMyId) continue;
            const v = data[id];
            
            // Gestion Markers
            if (!markers[id]) {
                markers[id] = L.marker([v.lat, v.lon]).addTo(map).bindPopup(id);
            } else {
                markers[id].setLatLng([v.lat, v.lon]);
            }

            // Détection PEC d'un autre
            if (v.active) alertSource = id;

            // Détection Proximité 500m
            if (myPos) {
                const d = L.latLng(myPos.lat, myPos.lon).distanceTo(L.latLng(v.lat, v.lon));
                if (d < 500) collision = true;
            }
        }

        // MAJ Interface
        const banner = document.getElementById('notification-banner');
        if (alertSource) {
            banner.innerText = "🚨 ALERTE : " + alertSource.replace(/_/g, " ");
            banner.className = "alert-active";
        } else {
            banner.innerText = "ZONE SÉCURISÉE";
            banner.className = "";
        }

        if (collision) mapDiv.classList.add('proximity-alert');
        else mapDiv.classList.remove('proximity-alert');
    });

    // Nettoyage en quittant
    window.onbeforeunload = () => {
        const safeId = myName.replace(/[^a-zA-Z0-9]/g, "_");
        db.ref('vehicles/' + safeId).remove();
    };
</script>
</body>
</html>
