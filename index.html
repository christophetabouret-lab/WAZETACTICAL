<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TACTICAL DEPLOY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; overflow: hidden; display: flex; flex-direction: column; }
        /* Titre centré à 80% de largeur [cite: 2026-01-25] */
        #main-title { width: 80%; margin: 10px auto; text-align: center; padding: 10px; border: 2px solid #e74c3c; color: #e74c3c; font-weight: bold; background: #2c2c2c; border-radius: 8px; text-transform: uppercase; }
        #map { flex: 1; width: 100%; background: #222; }
        #ui-panel { padding: 15px; background: #2c2c2c; border-top: 2px solid #444; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; color: white; text-transform: uppercase; cursor: pointer; }
        #qr-lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div id="qr-lock-screen">
    <div style="color:#e74c3c; font-weight:bold; margin-bottom:15px;">🔐 IDENTIFICATION TACTIQUE</div>
    <div id="reader" style="width: 85%; max-width: 400px;"></div>
</div>

<div id="main-app" style="display:none; flex-direction: column; height: 100vh;">
    <div id="main-title">TACTICAL DEPLOY</div>
    <div id="map"></div>
    <div id="ui-panel">
        <input type="text" id="user-id" placeholder="NOM DE L'UNITÉ" style="width: 80%; margin: 0 auto 10px auto; display: block; padding: 10px; text-align: center;">
        <div class="btn-grid">
            <button style="background:#444" onclick="location.reload()">🧹 NETTOYER</button>
            <button style="background:#8e44ad">🚧 STOP STICK</button>
            <button id="btn-pec" style="background:#e67e22; grid-column: span 2;">🚨 DÉMARRER</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Connexion au pont vocal Android [cite: 2026-01-24]
    function speak(t) { 
        if (window.AndroidVocal) { window.AndroidVocal.speakNative(t); } 
        else if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            window.speechSynthesis.speak(u);
        }
    }

    function unlock() { 
        document.getElementById('qr-lock-screen').style.display = 'none'; 
        document.getElementById('main-app').style.display = 'flex'; 
        speak("Système tactique connecté");
        initApp();
    }

    // Le scanner QR Code déverrouille l'interface [cite: 2026-01-24]
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
        if(txt === "TACTICAL-UNLOCK-2026") { html5QrCode.stop().then(unlock); }
    });

    function initApp() {
        firebase.initializeApp({ databaseURL: "https://poursuite-tactique-default-rtdb.europe-west1.firebasedatabase.app/" });
        const map = L.map('map', { zoomControl: false }).setView([46, 2], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png').addTo(map);
        setTimeout(() => { map.invalidateSize(); }, 800); // Force l'affichage de la carte
        
        const marker = L.circleMarker([0, 0], { color: '#3498db', radius: 10, fillOpacity: 1 }).addTo(map);
        navigator.geolocation.watchPosition((p) => {
            const pos = [p.coords.latitude, p.coords.longitude];
            marker.setLatLng(pos);
            map.setView(pos, map.getZoom());
        }, null, { enableHighAccuracy: true });
    }
</script>
</body>
</html>
