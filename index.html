<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TACTICAL DEPLOY</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100dvh; }
        
        #main-title {
            width: 80%; margin: 10px auto; text-align: center;
            padding: 10px; border: 2px solid #e74c3c; color: #e74c3c;
            font-weight: bold; background: #2c2c2c; border-radius: 8px;
            text-transform: uppercase; letter-spacing: 2px; flex-shrink: 0;
        }

        #map { flex-grow: 1; width: 100%; background: #222; }

        #notification-banner { 
            position: absolute; top: 70px; left: 10%; width: 80%;
            padding: 12px; border-radius: 4px; font-weight: bold; text-align: center;
            z-index: 1001; display: none;
        }

        .alert-active { display: block !important; background: #ff0000 !important; animation: pulse-red 0.5s infinite alternate; }

        @keyframes pulse-red { from { opacity: 1; } to { opacity: 0.7; } }

        #ui-panel { padding: 10px 15px; background: #2c2c2c; z-index: 1000; flex-shrink: 0; border-top: 2px solid #444; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; font-size: 0.75rem; }
        
        #btn-signal { background: #3498db; }
        #btn-signal.active { background: #2ecc71; border: 2px solid white; }
        
        #btn-pec { background: #e67e22; grid-column: span 2; margin-top: 5px; height: 50px; font-size: 0.9rem; }
        #btn-pec.active { background: #c0392b; border: 2px solid white; box-shadow: 0 0 15px #ff0000; }
        
        #btn-sat { background: #2c3e50; height: 35px; border: 1px solid #7f8c8d; }
        #btn-clear { background: #8e44ad; height: 35px; border: 1px solid #9b59b6; }

        input { width: 100%; padding: 10px; background: #444; border: 1px solid #666; color: white; border-radius: 4px; margin-bottom: 10px; box-sizing: border-box; }

        .proximity-alert { box-shadow: inset 0 0 40px #ff0000 !important; border: 6px solid #ff0000 !important; }
    </style>
</head>
<body>

<div id="main-title">TACTICAL DEPLOY</div>
<div id="notification-banner"></div>
<div id="map"></div>

<div id="ui-panel">
    <input type="text" id="user-id" placeholder="NOM DE L'UNITÉ">
    <div class="btn-grid">
        <button id="btn-signal">📡 S'AFFICHER : NON</button>
        <button id="btn-sat">🗺️ VUE SATELLITE</button>
        <button id="btn-pec">🚨 DÉMARRER PRISE EN CHARGE</button>
        <button id="btn-clear">🧹 NETTOYER BASE</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://poursuite-tactique-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const idInput = document.getElementById('user-id');
    const btnSignal = document.getElementById('btn-signal');
    const btnPec = document.getElementById('btn-pec');

    let myName = localStorage.getItem('unit_name') || "Unite-" + Math.floor(Math.random() * 999);
    idInput.value = myName;

    const map = L.map('map', { zoomControl: false }).setView([46, 2], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

    const myMarker = L.circleMarker([0, 0], { color: '#3498db', radius: 10, fillOpacity: 1, weight: 3 }).addTo(map);
    let myPos = null;
    let isVisible = false;
    let isPEC = false;
    const markers = {};

    // FONCTION UNIQUE D'ENVOI
    function sync() {
        if (!myPos) return;
        const name = idInput.value.trim() || "Anonyme";
        const safeId = name.replace(/[^a-zA-Z0-9]/g, "_");
        
        myMarker.setStyle({ color: isPEC ? '#ff0000' : '#3498db' });

        if (isVisible) {
            db.ref('vehicles/' + safeId).set({
                lat: myPos.lat,
                lon: myPos.lon,
                active: isPEC,
                ts: Date.now()
            });
        } else {
            db.ref('vehicles/' + safeId).remove();
        }
    }

    // BOUTON S'AFFICHER
    btnSignal.onclick = function() {
        isVisible = !isVisible;
        this.classList.toggle('active', isVisible);
        this.innerText = isVisible ? "📡 S'AFFICHER : OUI" : "📡 S'AFFICHER : NON";
        sync();
    };

    // BOUTON PEC
    btnPec.onclick = function() {
        isPEC = !isPEC;
        if (isPEC) {
            isVisible = true; // Force l'affichage si on lance une PEC
            btnSignal.classList.add('active');
            btnSignal.innerText = "📡 S'AFFICHER : OUI";
        }
        this.classList.toggle('active', isPEC);
        this.innerText = isPEC ? "🛑 STOP INTERCEPTION" : "🚨 DÉMARRER PRISE EN CHARGE";
        sync();
    };

    // VUE SATELLITE
    let isSat = false;
    document.getElementById('btn-sat').onclick = function() {
        if (!isSat) map.addLayer(satLayer); else map.removeLayer(satLayer);
        isSat = !isSat;
        this.innerText = isSat ? "🗺️ VUE ROUTE" : "🗺️ VUE SATELLITE";
    };

    // GPS
    navigator.geolocation.watchPosition((p) => {
        myPos = { lat: p.coords.latitude, lon: p.coords.longitude };
        myMarker.setLatLng([myPos.lat, myPos.lon]);
        if (isVisible) sync();
    }, null, { enableHighAccuracy: true });

    // RECEPTION
    db.ref('vehicles').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        let alertSource = null;
        const mySafeId = idInput.value.trim().replace(/[^a-zA-Z0-9]/g, "_");

        for (let id in data) {
            if (id === mySafeId) continue;
            const v = data[id];
            if (!v.ts || (Date.now() - v.ts > 120000)) continue;

            if (!markers[id]) markers[id] = L.circleMarker([v.lat, v.lon], { radius: 8, fillOpacity: 1 }).addTo(map).bindPopup(id);
            markers[id].setLatLng([v.lat, v.lon]);
            markers[id].setStyle({ color: v.active ? '#ff0000' : '#2ecc71' });
            if (v.active) alertSource = id;
        }

        const banner = document.getElementById('notification-banner');
        if (alertSource) {
            banner.innerText = "🚨 ALERTE : " + alertSource.replace(/_/g, " ").toUpperCase();
            banner.classList.add('alert-active');
        } else {
            banner.classList.remove('alert-active');
        }
    });

    document.getElementById('btn-clear').onclick = () => { if(confirm("Nettoyer ?")) db.ref('vehicles').remove(); };
</script>
</body>
</html>
